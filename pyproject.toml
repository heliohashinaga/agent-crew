[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory"
version = "0.1.0"
description = "AI Software Development Factory — autonomous coding that turns a natural-language request into a reviewed, merge-ready pull request"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.10",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.1.0",
    "pydantic>=2.0",
]

[project.scripts]
# Workflow CLIs. The folder-driven `dev-run` is the single entry point;
# `spec-run` console script was removed (FR-006) — its library remains for
# spec-side tooling and tests.
dev-run = "ai_factory.cli.dev_run:main"
folder-adapter = "ai_factory.shared.folder_adapter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs unit + contract tests only; integration tests are
# opt-in (they require network and a container runtime).
addopts = "-m 'not integration'"
markers = [
    "unit: fast unit tests, no network access",
    "contract: tests of the library-CLI contract seams",
    "integration: end-to-end workflow tests (network + container)",
]
