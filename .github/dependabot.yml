# Dependabot (GitHub) update configuration.
#
# Python deps are managed with `uv` (`pyproject.toml` + `uv.lock`), so the
# `uv` package-ecosystem is used so manifest and lockfile update together.
# CI is written with GitHub Actions templates, tracked by `github-actions`.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all Python dependency bumps into a single PR to reduce noise.
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
