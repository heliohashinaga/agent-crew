# CI for the AI Software Development Factory (T087).
# Runs lint (ruff) plus unit/contract tests with the network guard, then the
# opt-in integration tests (deterministic, fake sandbox/git host, no container).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit + contract tests (network blocked)
        run: uv run pytest -m "not integration"

      - name: Integration tests (deterministic, container-free)
        run: uv run pytest -m integration
